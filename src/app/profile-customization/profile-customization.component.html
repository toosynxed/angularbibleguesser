<app-modal [isOpen]="true" maxWidth="500px" [showFooter]="true" (close)="close.emit()">
  <h2 modal-title>Customize Your Profile</h2>

  <div class="customization-preview">
    <h3>Preview:</h3>
    <app-decorated-name [profile]="{ displayName: user.displayName, customization: customization }"></app-decorated-name>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label for="nameColor">Name Color</label>
      <input type="color" id="nameColor" [(ngModel)]="customization.nameColor" [disabled]="customization.nameEffect === 'rainbow'">
      <small *ngIf="customization.nameEffect === 'rainbow'">Disabled by Rainbow effect.</small>
    </div>

    <div class="form-group">
      <label for="nameEffect">Name Effect</label>
      <select id="nameEffect" [(ngModel)]="customization.nameEffect">
        <option
          *ngFor="let effect of nameEffects"
          [value]="effect.value"
          [disabled]="!isNameEffectUnlocked(effect.value)"
          [class.locked-option]="!isNameEffectUnlocked(effect.value)">
          {{ effect.label }}{{ isNameEffectUnlocked(effect.value) ? '' : ' (Locked)' }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="icon">Icon</label>
      <select id="icon" [(ngModel)]="customization.icon">
        <option
          *ngFor="let icon of icons"
          [value]="icon === 'None' ? '' : icon"
          [disabled]="!isIconUnlocked(icon)"
          [class.locked-option]="!isIconUnlocked(icon)">
          {{ icon }}{{ isIconUnlocked(icon) ? '' : ' (Locked)' }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="nameplate">Nameplate</label>
      <select id="nameplate" [(ngModel)]="customization.nameplate">
        <option
          *ngFor="let plate of nameplates"
          [value]="plate.value === 'none' ? '' : plate.value"
          [disabled]="!isNameplateUnlocked(plate.value)"
          [class.locked-option]="!isNameplateUnlocked(plate.value)">
          {{ plate.label }}{{ isNameplateUnlocked(plate.value) ? '' : ' (Locked)' }}
        </option>
      </select>
    </div>
  </div>

  <div modal-footer>
      <button type="button" class="btn-primary primary" (click)="saveCustomization()" [disabled]="isSaving">{{ saveButtonText }}</button>
  </div>
</app-modal>
