<div class="container">
    
  <header>
    <div class="header-controls">
      <button class="secondary-button" (click)="backToMap()" title="Back to Home">‹ Home</button>
    </div>
    <div class="clickable-header" (click)="confirmGoHome()" title="Back to Home">
      <img src="assets/logo.png" alt="Bible Guesser Logo" class="logo">
    </div>
    <p style="margin-block-end: 0px;" *ngIf="user$ | async as user" >Welcome, {{ user.displayName || 'Guest' }}</p>
  </header>

    <h3 style="margin: 0px;">Marketplace</h3>
    <h2>Items On Sale:</h2>
    <a (click)="calculateMarketItem()" class="refresh-link">Refresh Items</a>
    
    <div class="containerbox">
      <div *ngFor="let item of generatedMarketItems; let i = index" class="item-container">
        <div class="box" [ngClass]="item.background">
          <div class="item-name">{{ item.name }}</div>
          <!-- <div class="item-price">{{ item.price }} Scrolls</div> -->
          <div class="item-description">{{ item.description }}</div>
        </div>
        <button class="purchasebuttons" (click)="purchaseItem(item)">
          Purchase for {{ item.price }}
        </button>
      </div>
    </div>
    
    <div class="balancebox">
      <div class="balancetext">Remaining Balance: {{ (userScrolls$ | async) ?? 0 }}</div>
    </div>

  <ng-template #loading>
    <p>Loading quest data...</p>
  </ng-template>



  <ng-container *ngIf="user$ | async as user">
    <app-profile-customization *ngIf="showCustomization" [user]="user" (close)="showCustomization = false"></app-profile-customization>
  </ng-container>
