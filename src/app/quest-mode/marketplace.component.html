<div class="container container--full">
  <app-quest-header
    title="Marketplace"
    [user]="user$ | async"
    backLabel="‹ Quest Map"
    backMode="route"
    backRoute="/quest"
    logoMode="route"
    logoRoute="/">
  </app-quest-header>

  <h2>Items On Sale:</h2>
  <a (click)="calculateMarketItem()" class="refresh-link">Refresh Items</a>

  <div class="containerbox">
    <div *ngFor="let item of generatedMarketItems; let i = index" class="item-container">
      <div class="box" [ngClass]="item.background">
        <div class="item-name">{{ item.name }}</div>
        <div class="item-description">{{ item.description }}</div>
      </div>
      <button class="purchasebuttons" (click)="purchaseItem(item)">
        Purchase for {{ item.price }}
      </button>
    </div>
  </div>

  <app-scroll-balance [amount]="(userScrolls$ | async) ?? 0"></app-scroll-balance>

  <ng-template #loading>
    <p>Loading quest data...</p>
  </ng-template>

  <ng-container *ngIf="user$ | async as user">
    <app-profile-customization *ngIf="showCustomization" [user]="user" (close)="showCustomization = false"></app-profile-customization>
  </ng-container>
</div>
