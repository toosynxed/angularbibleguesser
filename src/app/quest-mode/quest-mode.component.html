<div class="container">
  <div *ngIf="user$ | async as user; else loading">
    <div class="profile-header">
      <h2>{{ user.displayName || 'Guest' }}'s Questline!</h2>
      <h3>Quest Map</h3>
    </div>

    <div class="Quest-Map">

        <img src="assets/quest-map.png" alt="Quest Map" class="quest-map-image" justify:left />

        <!-- Example of interactive quest points -->
        <div class="quest-point" style="top: 30%; left: 20%;">
            <div class="quest-tooltip">
            <h4>Forest of Beginnings</h4>
            <p>Complete 5 games in Normal Mode.</p>
            </div>
        </div>

        <div class="quest-point" style="top: 50%; left: 50%;">
            <div class="quest-tooltip">
            <h4>Cave of Challenges</h4>
            <p>Win a game in Custom Mode with at least 3 stars.</p>
            </div>
        </div>

        <div class="quest-point" style="top: 70%; left: 80%;">
            <div class="quest-tooltip">
            <h4>Castle of Champions</h4>
            <p>Play a multiplayer game and score over 80 points.</p>
            </div>
        </div>
    </div>

  </div>
  
  <ng-template #loading>
    <p>Loading quest data...</p>
  </ng-template>

  <div class="actions">
    <a routerLink="/" class="secondary-action">‹ Home</a>
  </div>

  <app-profile-customization *ngIf="showCustomization && (user$ | async)" [user]="(user$ | async)" (close)="showCustomization = false"></app-profile-customization>
</div>
